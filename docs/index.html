<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像一覧</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>画像ファイル一覧</h1>
    <div class="gallery" id="image-gallerys"></div>

    <script>
        const gallery = document.getElementById('image-gallerys');
        let img = null;
        let path = null;
        for (var i = 1; i <= 6; ++i) {
            path = "img/img-" + i + ".png";
            img = document.createElement('img');
            img.src = path;
            img.alt = "img-" + i;
            gallery.appendChild(img);
        }
    </script>
</body>
</html>
