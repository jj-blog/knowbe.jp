<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像一覧</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>画像ファイル一覧</h1>
    <div class="gallery" id="image-gallery"></div>

    <script>
        // GitHubリポジトリの情報を指定
        const user = 'jiyuujizai-info';
        const repo = 'knowbe.jp';
        const dir = 'images'; // 画像を保存しているフォルダ名

        // GitHub APIのエンドポイント
        const apiUrl = `https://github.com{user}/${repo}/contents/${dir}`;

        async function loadImageList() {
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();
                
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = ''; // 一度クリア

                // 画像ファイルだけをフィルタリング
                files.forEach(file => {
                    if (file.type === 'file' && file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.alt = file.name;
                        gallery.appendChild(img);
                    }
                });
            } catch (error) {
                console.error('画像の読み込みに失敗しました:', error);
            }
        }

        loadImageList();
    </script>
</body>
</html>
